[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "macro-scenario-forecast"
version = "1.0.0"
description = "Synthetic macroeconomic scenario and operating forecast model"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "pandas>=2,<3", "openpyxl>=3.1,<4"]

[project.scripts]
macro-forecast-demo = "macro_forecast.demo:main"

[tool.setuptools.packages.find]
where = ["src"]

